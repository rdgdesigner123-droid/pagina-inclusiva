<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Logotipo Conecta Bairro">
  <circle cx="32" cy="32" r="31" fill="#ffffff" stroke="#0b4f6c" stroke-width="2"/>

  <!-- sinal de conexao acima das duas pessoas -->
  <path d="M18 17 q14-11 28 0" fill="none" stroke="#9c3412" stroke-width="3" stroke-linecap="round"/>
  <path d="M24 23 q8-6 16 0" fill="none" stroke="#9c3412" stroke-width="3" stroke-linecap="round"/>

  <!-- pessoa da direita (desenhada atras) -->
  <g fill="#0b4f6c" stroke="#ffffff" stroke-width="2">
    <circle cx="42" cy="35" r="7"/>
    <path d="M30 57 q0-12 12-12 t12 12 z"/>
  </g>

  <!-- pessoa da esquerda (na frente) -->
  <g fill="#072f41" stroke="#ffffff" stroke-width="2">
    <circle cx="22" cy="35" r="7"/>
    <path d="M10 57 q0-12 12-12 t12 12 z"/>
  </g>
</svg>
